# Shared FlatLaf customizations applied on top of FlatLightLaf.
# Registered via FlatLaf.registerCustomDefaultsSource("flatlaf") in ThemeManager.
@accentColor=#2563eb
@dropShadowColor=rgba(15,23,42,60)

Component.arc=10
Button.arc=10
TextComponent.arc=8
Component.focusWidth=1
Component.innerFocusWidth=0

PasswordField.showRevealButton=true
Component.borderColor=#cbd5e1
Component.disabledBorderColor=#e2e8f0

Table.rowHeight=34
Table.alternateRowColor=#f8fafc
TableHeader.height=42
TableHeader.background=#f1f5f9
TableHeader.separatorColor=#e2e8f0

ScrollPane.smoothScrolling=true
ScrollBar.thumbArc=999
ScrollBar.trackArc=999
ScrollBar.width=10

Popup.borderCornerRadius=10
Tooltip.cornerStyle=round
