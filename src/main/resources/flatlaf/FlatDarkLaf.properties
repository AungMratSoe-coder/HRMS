# Shared FlatLaf customizations applied on top of FlatDarkLaf.
# Surfaces intentionally match ui.theme.Palette's monochrome dark ramp:
# #000000 (sidebar/table header), #161616 (window), #212121 (cards),
# #ffffff (text/accent) and #7e7e7e (muted text/borders).
@accentColor=#ffffff

Panel.background=#161616
Viewport.background=#161616
Component.borderColor=#7e7e7e55
Component.disabledBorderColor=#7e7e7e30
Component.focusColor=#ffffff

Table.background=#212121
Table.alternateRowColor=#161616
Table.selectionBackground=#7e7e7e
Table.selectionForeground=#000000
TableHeader.background=#000000
TableHeader.separatorColor=#7e7e7e40

TextField.background=#212121
PasswordField.background=#212121

List.selectionBackground=#7e7e7e
List.selectionForeground=#000000
ComboBox.selectionBackground=#7e7e7e
ComboBox.selectionForeground=#000000
Menu.selectionBackground=#7e7e7e
Menu.selectionForeground=#000000
PopupMenu.background=#212121
Tooltip.background=#212121

Button.default.foreground=#000000
ProgressBar.foreground=#ffffff

Component.arc=10
Button.arc=10
TextComponent.arc=8
Component.focusWidth=1
Component.innerFocusWidth=0

PasswordField.showRevealButton=true

Table.rowHeight=34
TableHeader.height=42

ScrollPane.smoothScrolling=true
ScrollBar.thumbArc=999
ScrollBar.trackArc=999
ScrollBar.width=10

Popup.borderCornerRadius=10
Tooltip.cornerStyle=round
