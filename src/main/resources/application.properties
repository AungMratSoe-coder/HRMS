# ============================================================================
# HR Management System - application configuration
# ============================================================================
# Any value of the form ${ENV_VAR} is resolved from an environment variable.
# Database settings additionally accept direct overrides via the environment
# variables HRMS_DB_URL, HRMS_DB_USER and HRMS_DB_PASSWORD.
# ============================================================================

# ---- Application -----------------------------------------------------------
app.name=HR Management System
app.version=1.0.0

# Development-only credential hint shown under the login form.
# REMOVE this line (or leave blank) for production builds.
app.login.hint=Default development credentials:  admin@ams.local / Admin@123

# Employee documents are stored on the file system (metadata lives in MySQL).
app.storage.documents-root=${HRMS_DOCUMENTS_ROOT}

# ---- Database --------------------------------------------------------------
# Development credentials only. Production deployments MUST provide the
# credentials through HRMS_DB_USER / HRMS_DB_PASSWORD instead of this file.
db.url=jdbc:mysql://localhost:3306/hrms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=password

# ---- Connection pool -------------------------------------------------------
db.pool.max-size=10
db.pool.min-idle=2
db.pool.connection-timeout-seconds=10
